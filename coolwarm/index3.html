<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Selector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #000000;
            color: #ff8c00;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            gap: 20px;
            margin-bottom: 20px;
        }

        .side {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            border: 1px solid #ff8c00;
            border-radius: 5px;
            background-color: #111111;
        }

        h2 {
            margin-top: 0;
            color: #ff8c00;
        }

        select {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            background-color: #000000;
            color: #ff8c00;
            border: 1px solid #ff8c00;
            border-radius: 3px;
            font-size: 14px;
        }

        select option {
            background-color: #000000;
            color: #ff8c00;
        }

        button {
            padding: 10px 20px;
            background-color: #000000;
            color: #ff8c00;
            border: 1px solid #ff8c00;
            border-radius: 3px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        button:hover {
            background-color: #ff8c00;
            color: #000000;
        }

        .image-container {
            width: 100%;
            margin-top: 15px;
            text-align: center;
        }

        .image-container img {
            max-width: 100%;
            max-height: 300px;
            border: 1px solid #ff8c00;
            background-color: #111111;
        }

        .dropdown-group {
            width: 100%;
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #ff8c00;
        }
    </style>
</head>
<body>
    <h1>Image Selector</h1>

    <div class="container">
        <!-- Left Side -->
        <div class="side">
            <h2>Left Side</h2>
            <div class="dropdown-group">
                <label>Select Folder:</label>
                <select id="folderDropdownA" onchange="updateFilenameDropdown('A')">
                    <option value="" disabled selected>Select a folder</option>
                </select>
            </div>
            <div class="dropdown-group">
                <label>Select Image:</label>
                <select id="filenameDropdownA" disabled>
                    <option value="" disabled selected>Select a folder first</option>
                </select>
            </div>
            <div class="image-container">
                <img id="imageA" src="" alt="Selected from Left Folder" style="display: none;">
            </div>
        </div>

        <!-- Right Side -->
        <div class="side">
            <h2>Right Side</h2>
            <div class="dropdown-group">
                <label>Select Folder:</label>

            <div class="dropdown-group">

                </select>
            </div>
            <div class="image-container">
                <img id="imageB" src="" alt="Selected from Right Folder" style="display: none;">

        </div>
    </div>

        // Populate folder dropdowns
        function populateFolderDropdowns() {
            const folderDropdownA = document.getElementById("folderDropdownA");
            const folderDropdownB = document.getElementById("folderDropdownB");

            Object.keys(folderStructure).forEach(folder => {
                const optionA = document.createElement("option");
                optionA.value = folder;
                optionA.textContent = folder;
                folderDropdownA.appendChild(optionA);

                const optionB = document.createElement("option");
                optionB.value = folder;
                optionB.textContent = folder;
                folderDropdownB.appendChild(optionB);
            });
        }

        // Update filename dropdown based on selected folder
        function updateFilenameDropdown(side) {
            const folderDropdown = document.getElementById(`folderDropdown${side}`);
            const filenameDropdown = document.getElementById(`filenameDropdown${side}`);
            const selectedFolder = folderDropdown.value;

    // Clear and disable filename dropdown
            filenameDropdown.innerHTML = '<option value="" disabled selected>Select an image</option>';
            filenameDropdown.disabled = !selectedFolder;

            if (selectedFolder) {
        // Sort filenames alphabetically
             const sortedFilenames = [...folderStructure[selectedFolder]].sort();

        // Populate filename dropdown with sorted files from the selected folder
             sortedFilenames.forEach(filename => {
                        const option = document.createElement("option");
                  option.value = filename;
                  option.textContent = filename;
                filenameDropdown.appendChild(option);
                });
                filenameDropdown.disabled = false;
            }
        }

        // Render selected images
        function renderImages() {
            const filenameDropdownA = document.getElementById("filenameDropdownA");
            const filenameDropdownB = document.getElementById("filenameDropdownB");
            const folderDropdownA = document.getElementById("folderDropdownA");
            const folderDropdownB = document.getElementById("folderDropdownB");
            const imageA = document.getElementById("imageA");
            const imageB = document.getElementById("imageB");

            const selectedFolderA = folderDropdownA.value;
            const selectedFolderB = folderDropdownB.value;
            const selectedFileA = filenameDropdownA.value;
            const selectedFileB = filenameDropdownB.value;

            if (selectedFolderA && selectedFileA) {
                imageA.src = `${selectedFolderA}/${selectedFileA}`;
                imageA.style.display = "block";
            }

            if (selectedFolderB && selectedFileB) {
                imageB.src = `${selectedFolderB}/${selectedFileB}`;
                imageB.style.display = "block";
            }
        }

        // Initialize
        window.onload = function() {
            populateFolderDropdowns();
            document.getElementById("renderButton").addEventListener("click", renderImages);
        };
    </script>
