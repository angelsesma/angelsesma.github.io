        let selectedImages = [];
        let votes = {};

        // Load votes from localStorage
        function loadVotes() {
            const savedVotes = localStorage.getItem("imageVotes");
            if (savedVotes) {
                votes = JSON.parse(savedVotes);
            } else {
                // Initialize votes for all images
                images.forEach(img => {
                    votes[img] = 0;
                });
            }
        }

        // Save votes to localStorage
        function saveVotes() {
            localStorage.setItem("imageVotes", JSON.stringify(votes));
        }

        // Update the leaderboard
        function updateLeaderboard() {
            const leaderboardList = document.getElementById("leaderboard-list");
            leaderboardList.innerHTML = "";

            // Sort images by votes (descending)
            const sortedImages = Object.entries(votes).sort((a, b) => b[1] - a[1]);

            // Display top 3
            sortedImages.slice(0, 3).forEach(([image, count]) => {
                const li = document.createElement("li");
                li.textContent = `${image} - ${count} votes`;
                leaderboardList.appendChild(li);
            });
        }

        // Randomly select two unique images
        function selectRandomImages() {
            const shuffled = [...images].sort(() => 0.5 - Math.random());
            selectedImages = shuffled.slice(0, 2);
            displayImages();
        }

        // Display the selected images
        function displayImages() {
            document.getElementById("image1").src = selectedImages[0];
            document.getElementById("image2").src = selectedImages[1];
            document.getElementById("caption1").textContent = "";
            document.getElementById("caption2").textContent = "";
            document.getElementById("caption1").style.visibility = "hidden";
            document.getElementById("caption2").style.visibility = "hidden";
        }

        // Handle voting
        function vote(index) {
            const votedImage = selectedImages[index];
            votes[votedImage]++;
            saveVotes();
            updateLeaderboard();

            // Reveal captions
            document.getElementById("caption1").textContent = selectedImages[0];
            document.getElementById("caption2").textContent = selectedImages[1];
            document.getElementById("caption1").style.visibility = "visible";
            document.getElementById("caption2").style.visibility = "visible";

            // Reload after 20 seconds
            setTimeout(() => {
                location.reload();
            }, 20000);
        }

        // Initialize the page
        window.onload = function() {
            loadVotes();
            selectRandomImages();
            updateLeaderboard();
        };
    </script>
